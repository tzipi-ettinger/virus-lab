# CI: runs on every PR and on main. Job names (backend, frontend, contract)
# are the required status checks in the main branch protection - keep them stable.
# Owner: shared

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Storage tests run against a real Postgres, like docker-compose.yml (D11).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: virus_lab
          POSTGRES_PASSWORD: virus_lab
          POSTGRES_DB: virus_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virus_lab -d virus_lab_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://virus_lab:virus_lab@127.0.0.1:5432/virus_lab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # openapi.json matches the backend code, and schema.d.ts matches openapi.json.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m scripts.export_openapi --check
        working-directory: backend
      - run: npm run gen:api
        working-directory: frontend
      - name: schema.d.ts is up to date
        run: git diff --exit-code -- frontend/src/api/schema.d.ts || (echo "Run 'npm run gen:api' in frontend/ and commit." && exit 1)

  # The image Render deploys (Dockerfile at the root) builds, starts without a DB,
  # and serves both the API and the page. Not a required check.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t virus-lab .
      - name: The image serves the API and the page
        run: |
          docker run -d --name app -p 8000:8000 -e FRONTEND_ORIGIN=http://localhost:8000 virus-lab
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS localhost:8000/api/health
          curl -fsS localhost:8000/records/x | grep -q 'id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/nope)" = 404
      - if: always()
        run: docker logs app || true

  # No API key, token or private key in any commit. Scans the full history,
  # so a secret added and then deleted in a later commit still fails.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - run: ./gitleaks git --redact --verbose .
