# Closed list of senders (SPEC 5.5) + aliases as they appear on forms.
# Sources: the 4 health funds named in the challenge PDF; general hospitals from
# the Hebrew Wikipedia list "בתי חולים בישראל" (checked 2026-10-18); other senders
# seen in the sample forms (SPEC 6).
#
# Matching (rules/senders.py) ignores niqqud, quote marks, punctuation and case.
# An alias must be specific enough to point to one sender: no bare city names
# ("נהריה", "השרון"), since a health fund's district can carry the same word.
# Owner: B

senders:
